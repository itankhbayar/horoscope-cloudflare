name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "lts/*"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Install all npm workspaces from the root lockfile so shared, backend,
      # frontend, and mobile dependencies resolve exactly as committed.
      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Validate Worker cron schedule
        run: npm run validate:cron

      - name: Run backend Vitest suite
        run: npm test -w backend -- --reporter=default --reporter=junit --outputFile=reports/backend-vitest.xml

      # Frontend + mobile suites run here (before the build) so analytics ownership protections and
      # other unit tests fail the pipeline fast on every PR. Both are pure-logic Vitest suites in a
      # Node environment (~1-2s each), so they add negligible time. Dependencies are already present
      # from the single `npm ci` above; no extra install is needed.
      - name: Run frontend Vitest suite
        run: npm test -w horoscope-frontend

      - name: Run mobile Vitest suite
        run: npm test -w astralis-mobile

      - name: Build frontend
        run: npm run build -w horoscope-frontend

      # Wrangler performs the same bundling path used by production deploys,
      # but dry-run keeps validation free of Cloudflare credentials.
      - name: Build backend Worker with Wrangler dry run
        run: npm exec -w backend -- wrangler deploy --dry-run --outdir .wrangler/ci-build --minify

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vitest-results
          path: backend/reports/backend-vitest.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy-backend:
    name: Deploy Backend Worker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # The Worker is TypeScript and imports package dependencies, so Wrangler
      # needs the workspace install before deployment bundling.
      - name: Install workspace dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --minify

  deploy-frontend:
    name: Deploy Frontend Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=horoscope-frontend --branch=main
